# Системный tmux.conf для aidev. Пользовательский ~/.tmux.conf читается после него.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB,*256col*:RGB"
set -g mouse on
set -g history-limit 100000
set -sg escape-time 10          # без задержки Esc (vim, TUI агентов)
set -g focus-events on
set -s extended-keys on         # Shift+Enter и пр. в Claude Code / opencode
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on     # OSC-последовательности (уведомления, картинки)
set -s set-clipboard on         # копирование в буфер хоста через OSC 52
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[fg=colour39,bold] #S #[default]"
set -g status-right "#[fg=colour244]#h %H:%M "

# Сплиты в текущем каталоге
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window      -c "#{pane_current_path}"
bind r   source-file /etc/tmux.conf \; display "tmux.conf reloaded"
